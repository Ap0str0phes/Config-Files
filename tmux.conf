# ==============================================================================
# 1. GENERAL SETTINGS
# ==============================================================================


# Change prefix from default Ctrl+b to Ctrl+a (more ergonomic)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set history limit to 50,000 lines
set -g history-limit 50000

# Eliminate delay when pressing the Esc key (vital for Vim/Neovim users)
set -s escape-time 0

# Enable full mouse support (clicking, resizing, scrolling)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Fix colors: ensure true color and 256-color support work flawlessly
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ==============================================================================
# 2. KEY BINDINGS & NAVIGATION
# ==============================================================================
# Reload the configuration file instantly with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using logical visual cues: | for horizontal, - for vertical
# Also ensures new panes open in the current working directory
unbind %
unbind '"'
bind | split-window -h -c "#{panel_current_path}"
bind - split-window -v -c "#{panel_current_path}"

# Navigate panes using Vim directions (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Shift + Vim directions (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use Vi keybindings when scrolling/copying text in Copy Mode (Prefix + [)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# 3. THEME & VISUALS (Minimal & Clean)
# ==============================================================================
# Position status bar at the top instead of bottom
#set -g status-position top

# Status bar colors (Dark background, subtle text)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Show session name with a background accent
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "

# Right status: Clean date and time formatting
set -g status-right "#[fg=#a6adc8,bg=#313244] %Y-%m-%d │ %I:%M %p "

# Active/Inactive window tab styling
set -g window-status-current-format "#[bg=#f5c2e7,fg=#11111b,bold] #I:#W* "
set -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W "

